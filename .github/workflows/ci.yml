name: release

on:
  push:
    branches: main

permissions:
  contents: write

jobs:
  create-release:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version 
        id: version
        run: |
          version=$(jq -r ".version" manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Get previous tag
        id: previous_tag
        run: |
          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $previous_tag"

      - name: Generate changelog
        id: changelog
        run: |
          previous_tag="${{ steps.previous_tag.outputs.tag }}"

          if [ -n "$previous_tag" ]; then
            git log "$previous_tag"..HEAD --pretty=format:"- %s" > changelog.txt
          else
            git log HEAD --pretty=format:"- %s" > changelog.txt
          fi

          echo "Changes:"
          cat changelog.txt
        
      - name: Tag commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install web-ext
        run: |
          npm install --global web-ext

      - name: Create XPI 
        run: |
          web-ext build --filename tanban.xpi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file changelog.txt \
            web-ext-artifacts/tanban.xpi

