<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tanban Thunderbird</title>
    <link rel="stylesheet" type="text/css" href="tanban.css">
</head>
<body>
    <div id="tanban-board">
        <header>
            <h1>Tanban Board</h1>
            <div class="header-actions">
                <div class="filter-wrapper">
                    <input type="text" id="category-filter" placeholder="Search categories…" />
                    <ul id="category-dropdown" class="category-dropdown"></ul>
                </div>
                <button id="new-task-btn">+ New Task</button>
                <button id="refresh-btn">Refresh Tasks</button>
            </div>
        </header>
        
        <div id="toolbar" class="toolbar">
            <div id="active-filters" class="active-filters"></div>
            <div
                id="theme-slider"
                class="theme-slider"
                title="Toggle light/dark theme"
            >
                <span class="theme-slider-glyph">☾</span>
                <span class="theme-slider-track">
                    <span class="theme-slider-thumb"></span>
                </span>
                <span class="theme-slider-glyph">☀</span>
            </div>
        </div>

        <div id="tanban-columns">
            <!-- Columns will be dynamically generated here -->
        </div>
    </div>
    
    <script src="tanban.js"></script>
</body>
</html>
